services:
  api:
    build: .
    ports: ["3000:3000"]
    environment:
      # Inside the compose network the database answers to its service name, not localhost.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        # Not just "started": the app creates its table on import, so it needs a database
        # that is accepting connections, and Postgres accepts them a moment after it starts.
        condition: service_healthy

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Published so you can also run the app on your machine against this same database,
    # which is what the DATABASE_URL in .env.example points at.
    ports: ["5432:5432"]
    volumes: [taskdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  taskdata:
